apiVersion: v1
kind: Namespace
metadata:
  name: homework08
  labels:
    app.kubernetes.io/part-of: homework08
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homework08-hello-page
  namespace: homework08
  labels:
    app.kubernetes.io/name: homework08-hello
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Homework 08</title>
        <style>
          body { font-family: system-ui, sans-serif; margin: 4rem; color: #172554; }
          main { max-width: 46rem; margin: auto; }
          code { background: #e0f2fe; padding: 0.2rem 0.4rem; }
        </style>
      </head>
      <body>
        <main>
          <h1>Hello from Homework 08</h1>
          <p>The six-node k3s cluster is serving this page successfully.</p>
          <p>This pod is restricted to a node with the <code>worker=true</code> role.</p>
        </main>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homework08-hello
  namespace: homework08
  labels:
    app.kubernetes.io/name: homework08-hello
    app.kubernetes.io/part-of: homework08
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homework08-hello
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homework08-hello
        app.kubernetes.io/part-of: homework08
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      containers:
        - name: web
          image: __HELLO_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: page
          configMap:
            name: homework08-hello-page
---
apiVersion: v1
kind: Service
metadata:
  name: homework08-hello
  namespace: homework08
  labels:
    app.kubernetes.io/name: homework08-hello
spec:
  selector:
    app.kubernetes.io/name: homework08-hello
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homework08-hello
  namespace: homework08
  labels:
    app.kubernetes.io/name: homework08-hello
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homework08-hello
                port:
                  name: http
